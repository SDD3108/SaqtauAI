<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Saqtau AI family invitation</title>
    <style>
      body { margin:0; background:#ececec; color:#181027; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      main { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; }
      .card { width:min(100%,430px); background:white; border-radius:28px; padding:28px; box-sizing:border-box; text-align:center; }
      h1 { margin:0; font-size:28px; letter-spacing:-.7px; }
      p { color:#716c79; line-height:1.5; }
      a { display:block; margin-top:12px; padding:15px 18px; border-radius:999px; text-decoration:none; font-weight:700; }
      #open { background:#181027; color:white; }
      #store { background:#208aef; color:white; display:none; }
      .small { margin-top:18px; font-size:12px; color:#9a96a2; }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>Family invitation</h1>
        <p>Open this invitation in Saqtau AI to review and accept it.</p>
        <a id="open" href="#">Open Saqtau AI</a>
        <a id="store" href="#">Download on the App Store</a>
        <p class="small">The App Store button appears after an App Store Connect URL is configured.</p>
      </section>
    </main>
    <script>
      const token = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
      const open = document.getElementById('open');
      open.href = `saqtau://family/invite/${encodeURIComponent(token)}`;

      // Part 14: set this after the App Store Connect record exists.
      const APP_STORE_URL = '';
      if (APP_STORE_URL) {
        const store = document.getElementById('store');
        store.href = APP_STORE_URL;
        store.style.display = 'block';
      }
    </script>
  </body>
</html>
